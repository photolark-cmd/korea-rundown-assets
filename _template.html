<meta charset="utf-8">
<meta name="google" content="notranslate">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#0E2A33; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:
      radial-gradient(1100px 620px at 78% 12%, rgba(46,140,158,.42) 0%, rgba(46,140,158,0) 62%),
      linear-gradient(148deg, #0E2A33 0%, #113B47 52%, #0C222A 100%);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#F4F1EA;
    padding:56px 64px 48px;
    display:flex; flex-direction:column;
    position:relative;
  }
  /* faint grid = "city block" texture */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:78px 78px;
    mask-image:linear-gradient(115deg, transparent 40%, #000 100%);
    -webkit-mask-image:linear-gradient(115deg, transparent 40%, #000 100%);
  }
  .inner { position:relative; display:flex; flex-direction:column; height:100%; }

  .series {
    display:flex; align-items:center; gap:13px;
    font-size:13px; font-weight:700; letter-spacing:.17em; text-transform:uppercase;
    color:#7FC3D4;
  }
  .rule { width:40px; height:2px; background:#D9A441; }
  .part { color:#D9A441; }

  .stack { margin-top:auto; }

  .figure {
    font-size:150px; font-weight:900; letter-spacing:-.045em; line-height:.92;
    color:#FFFFFF;
  }
  .figure .unit { font-size:60px; font-weight:800; letter-spacing:-.02em; color:#9FD3E0; margin-left:12px; }

  .kicker {
    margin-top:20px;
    font-size:37px; font-weight:800; letter-spacing:-.022em; line-height:1.22;
    color:#F4F1EA; max-width:960px;
  }
  .kicker b { color:#F3C063; font-weight:800; }

  .foot {
    margin-top:26px; padding-top:20px;
    border-top:1px solid rgba(244,241,234,.17);
    display:flex; justify-content:space-between; align-items:center;
  }
  .brand { font-size:16px; font-weight:900; letter-spacing:.13em; color:#F4F1EA; }
  .sub { font-size:14px; font-weight:600; color:#8FB6C1; letter-spacing:.02em; }
</style>

<div class="grid"></div>
<div class="inner">
  <div class="series">
    <span class="rule"></span>
    <span>Why Korea Is So Convenient</span>
    <span class="part">&middot; Part 3</span>
  </div>

  <div class="stack">
    <div class="figure">$1.10<span class="unit">a ride</span></div>
    <div class="kicker">Seoul charges for <b>distance</b>.<br>New York charges for the turnstile.</div>
  </div>

  <div class="foot">
    <div class="brand">KOREA RUNDOWN</div>
    <div class="sub">korearundown.blogspot.com</div>
  </div>
</div>
